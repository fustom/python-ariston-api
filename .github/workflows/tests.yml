name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Install package
        run: python -m pip install --only-binary=:all: --no-deps --no-build-isolation .
      - name: Run unit tests
        run: python -m unittest discover --start-directory tests --verbose
